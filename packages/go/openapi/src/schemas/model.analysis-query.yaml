type: object
properties:
  namespace:
    type: string
  version:
    type: string
  schema_version:
    type: string
  extension_versions:
    type: string
  input_warning:
    type: string
  name:
    type: string
  extension:
    type: string
  extension_name:
    type: string
  added_at:
    type: string
    description: UTC timestamp, or an empty string when unavailable.
  disabled_reason:
    type: string
  enabled:
    type: boolean
  author_enabled:
    type: boolean
    description: Saved author choice. An author-enabled query can still be blocked;
      enabled describes current availability.
  order:
    type: integer
    format: int64
    minimum: 0
  stage:
    type: integer
    format: int64
    minimum: 0
  parameter:
    type: string
  text:
    type: string
    description: The original uploaded Cypher file, including comments and declarations.
  inputs:
    type: array
    items:
      type: object
      properties:
        type:
          type: string
          enum:
          - node
          - relationship
        name:
          type: string
      required:
      - type
      - name
  prerequisites:
    type: array
    items:
      type: object
      properties:
        conditions:
          type: string
        name:
          type: string
        parameter:
          type: string
      required:
      - name
      - parameter
    description: Direct answer parameters only. Use workspace dependencies for complete
      execution connections.
  dependents:
    type: array
    items:
      type: string
    description: Direct answer consumers only; use workspace dependencies for complete
      connections.
  outputs:
    type: array
    items:
      type: object
      properties:
        type:
          type: string
          enum:
          - node
          - relationship
        kind:
          type: string
        producers:
          type: array
          items:
            type: string
        id_prefix:
          type: string
        endpoints:
          type: array
          items:
            type: object
            properties:
              source_kind:
                type: string
              target_kind:
                type: string
            required:
            - source_kind
            - target_kind
        existing_edge_policy:
          type: string
          enum:
          - replace-existing
          - merge-properties
          - keep-existing
      required:
      - type
      - kind
  processing:
    type: object
    properties:
      reachability:
        type: object
        properties:
          direction:
            type: string
            enum:
            - incoming
            - outgoing
          relationships:
            type: array
            items:
              type: string
          include_start:
            type: boolean
          expand_results:
            type: boolean
          reject_cycles:
            type: boolean
          node_kinds:
            type: array
            items:
              type: string
        required:
        - direction
        - relationships
        - include_start
        - expand_results
        - reject_cycles
      group_overlap:
        type: object
        properties:
          memberships:
            type: string
        required:
        - memberships
      batch_dependency:
        type: string
required:
- namespace
- version
- schema_version
- name
- extension
- extension_name
- added_at
- disabled_reason
- enabled
- author_enabled
- order
- stage
- parameter
- text
- inputs
- prerequisites
- dependents
- outputs
- processing
