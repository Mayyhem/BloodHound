get:
  summary: Download one original analysis file at the displayed revision
  operationId: DownloadAnalysisQuery
  tags:
  - OpenGraph (Experimental)
  - Community
  description: Requires OpenGraph read permission and the extension-management feature
    flag. Reads a fresh workspace copy and checks BOTH revisions. Returns the exact
    original file, or a conflict asking the author to refresh. No historical files
    are retained by this endpoint. Responses are not cached.
  parameters:
  - name: query
    in: query
    required: true
    description: Namespace and filename, for example PoC_AD/users.cypher.
    schema:
      type: string
      pattern: ^[A-Za-z_][A-Za-z0-9_]*/[a-z][a-z0-9]*(?:_[a-z0-9]+)*\.cypher$
  - name: revision
    in: query
    required: true
    description: Displayed rule revision.
    schema:
      type: string
      pattern: ^[a-f0-9]{64}$
  - name: schema_revision
    in: query
    required: true
    description: Displayed schema revision.
    schema:
      type: string
      pattern: ^[a-f0-9]{64}$
  responses:
    200:
      description: Original Cypher file.
      headers:
        Content-Disposition:
          description: Attachment with the original base filename.
          schema:
            type: string
      content:
        text/plain:
          schema:
            type: string
    400:
      description: Missing, repeated, or invalid query parameters.
    409:
      description: Rules or schemas changed; refresh before downloading.
    401:
      $ref: ../responses/unauthorized.yaml
    403:
      $ref: ../responses/forbidden.yaml
    404:
      $ref: ../responses/not-found.yaml
    502:
      description: The configured rule service or its schema read is unavailable,
        or its response is invalid or oversized.
    503:
      description: OpenGraph analysis is not configured.
