get:
  summary: Get analysis draft
  operationId: Getanalysisdraft
  tags:
  - OpenGraph (Experimental)
  - Community
  description: Read the saved inactive upload, including files that cannot yet be activated. Requires
    the extension-management feature flag and OpenGraph read permission. Responses are not cached. The
    browser cannot supply a service destination or credentials.
  responses:
    200:
      description: Requested draft, review, or activated revision.
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: ../schemas/model.analysis-draft.yaml
    401:
      $ref: ../responses/unauthorized.yaml
    403:
      $ref: ../responses/forbidden.yaml
    404:
      $ref: ../responses/not-found.yaml
    502:
      description: Service unavailable, invalid reply, or unconfirmed result. Refresh before another write.
    503:
      description: OpenGraph analysis is not configured.
put:
  summary: Save analysis draft
  operationId: Saveanalysisdraft
  tags:
  - OpenGraph (Experimental)
  - Community
  description: Save uploaded .cypher files without changing active rules. Checks exact active and draft
    revisions and explicit overwrite choices. Missing schemas or prerequisites may leave a saved invalid
    draft. Requires the extension-management feature flag and OpenGraph read permission. Also requires
    OpenGraph write permission. Responses are not cached. The browser cannot supply a service destination
    or credentials.
  responses:
    200:
      description: Requested draft, review, or activated revision.
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: ../schemas/model.analysis-draft.yaml
    401:
      $ref: ../responses/unauthorized.yaml
    403:
      $ref: ../responses/forbidden.yaml
    404:
      $ref: ../responses/not-found.yaml
    502:
      description: Service unavailable, invalid reply, or unconfirmed result. Refresh before another write.
    503:
      description: OpenGraph analysis is not configured.
    400:
      description: Invalid or ambiguous request; unknown fields and repeated JSON keys are rejected.
    409:
      description: Rule, schema, or draft revision changed, or overwrite confirmation is missing. Refresh
        and review again.
    413:
      description: Request exceeds 4 MiB.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/model.analysis-change.yaml
delete:
  summary: Discard analysis draft
  operationId: Discardanalysisdraft
  tags:
  - OpenGraph (Experimental)
  - Community
  description: Discard only the draft named by draft_revision. Does not change active rules or graph results.
    Requires the extension-management feature flag and OpenGraph read permission. Also requires OpenGraph
    write permission. Responses are not cached. The browser cannot supply a service destination or credentials.
  responses:
    204:
      description: Saved inactive draft discarded.
    401:
      $ref: ../responses/unauthorized.yaml
    403:
      $ref: ../responses/forbidden.yaml
    404:
      $ref: ../responses/not-found.yaml
    502:
      description: Service unavailable, invalid reply, or unconfirmed result. Refresh before another write.
    503:
      description: OpenGraph analysis is not configured.
    400:
      description: Invalid or ambiguous request; unknown fields and repeated JSON keys are rejected.
    409:
      description: Rule, schema, or draft revision changed, or overwrite confirmation is missing. Refresh
        and review again.
    413:
      description: Request exceeds 4 MiB.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/model.analysis-change.yaml
