type: object
additionalProperties: false
required:
- base_revision
properties:
  base_revision:
    type: string
    description: Displayed active rule revision; empty only when no rules are active.
  schema_revision:
    type: string
    description: Displayed installed schema revision. Required for native preview and activation; optional
      for saving an inactive draft.
  draft_revision:
    type: string
    description: Exact saved draft revision. Required when reviewing, updating, or discarding that draft.
  confirm_revision:
    type: string
    description: Exact proposed revision returned by review. Required for activation.
  files:
    type: object
    maxProperties: 32
    additionalProperties:
      type: string
    description: Namespaced .cypher filenames mapped to original text. At most 1 MiB per file; the complete
      request is at most 4 MiB.
  overwrite:
    type: array
    maxItems: 32
    uniqueItems: true
    items:
      type: string
  remove:
    type: array
    maxItems: 32
    uniqueItems: true
    items:
      type: string
  disable:
    type: array
    maxItems: 32
    uniqueItems: true
    items:
      type: string
  enable:
    type: array
    maxItems: 32
    uniqueItems: true
    items:
      type: string
