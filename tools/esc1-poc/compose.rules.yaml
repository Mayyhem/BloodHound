# Start this registry once alongside the selected BloodHound installation.
name: bloodhound-rules
services:
  rule-service:
    image: ${POSTPROCESSOR_IMAGE:-esc1-poc-postprocessor:local}
    pull_policy: never
    command: [serve, -listen, ':8081', -state, /workspace/rules, -local-ui-origin, 'http://127.0.0.1:18081']
    environment:
      POSTPROCESSOR_RULE_TOKEN: ${POSTPROCESSOR_RULE_TOKEN:?Run scripts/build-extensions.sh to create private rules.env}
      # Optional: enables Run Analysis without asking the browser for a secret.
      BLOODHOUND_API_URL: ${BLOODHOUND_API_URL:-}
      BLOODHOUND_API_TOKEN_ID: ${BLOODHOUND_API_TOKEN_ID:-}
      BLOODHOUND_API_TOKEN_KEY: ${BLOODHOUND_API_TOKEN_KEY:-}
    user: "${POSTPROCESSOR_UID:-1000}:${POSTPROCESSOR_GID:-1000}"
    ports:
      - 127.0.0.1:18081:8081
    volumes:
      - ${RULE_STATE_DIR:-./work/rules}:/workspace/rules
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 10s
    networks: [bloodhound]
networks:
  bloodhound:
    external: true
    name: ${BH_DOCKER_NETWORK:-esc1-poc_default}
