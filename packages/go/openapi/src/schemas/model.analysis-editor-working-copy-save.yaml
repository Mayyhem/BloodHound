type: object
additionalProperties: false
required:
- name
properties:
  name:
    type: string
    maxLength: 256
    pattern: ^[A-Za-z_][A-Za-z0-9_]*/[a-z][a-z0-9]*(?:_[a-z0-9]+)*\.cypher$
    description: Namespace and filename for the unfinished analysis.
  text:
    type: string
    maxLength: 1048576
    description: Unfinished UTF-8 Cypher text. It may be empty or incomplete because this action does not activate a rule.
  base_revision:
    type: string
    pattern: ^$|^[a-f0-9]{64}$
    description: Active rule revision visible when the author began editing, if known.
  revision:
    type: string
    pattern: ^$|^[a-f0-9]{64}$
    description: Exact prior working-copy revision. Omit it only when creating a new working copy.
