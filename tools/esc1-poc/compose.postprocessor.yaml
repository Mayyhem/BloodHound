# Use the existing lab network without changing or recreating its services.
# Run one command with:
# docker compose --env-file postprocessor.env -f compose.postprocessor.yaml run --rm --no-deps postprocessor plan -extension /extension
name: bloodhound-postprocessor
services:
  postprocessor:
    image: ${POSTPROCESSOR_IMAGE:-esc1-poc-postprocessor:local}
    build:
      context: ./work/container-build
      dockerfile: Dockerfile
    pull_policy: never
    command: [plan, -extension, /extension]
    environment:
      POSTPROCESSOR_MODE: container
      GRAPH_DRIVER: ${GRAPH_DRIVER:-neo4j}
      POSTGRES_CONTAINER: ${POSTGRES_CONTAINER:-esc1-poc-pg-db-1}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-bloodhound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      BH_CONTAINER: ${BH_CONTAINER:-esc1-poc-bloodhound-1}
      NEO4J_CONTAINER: ${NEO4J_CONTAINER:-esc1-poc-graph-db-1}
      BH_DOCKER_NETWORK: ${BH_DOCKER_NETWORK:-esc1-poc_default}
      BH_INTERNAL_PORT: ${BH_INTERNAL_PORT:-8080}
      NEO4J_INTERNAL_PORT: ${NEO4J_INTERNAL_PORT:-7687}
      BH_TOKEN: ${BH_TOKEN:-}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
    # Match the host user so command-line and container runs share private files.
    user: "${POSTPROCESSOR_UID:-1000}:${POSTPROCESSOR_GID:-1000}"
    group_add: ["${DOCKER_SOCKET_GID:-0}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    # Allow time to restart BloodHound when this command receives a stop request.
    stop_grace_period: 90s
    volumes:
      # Docker API calls need socket access, including BloodHound stop/start.
      # This grants Docker control on the host; dropping capabilities does not restrict that API.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${EXTENSION_DIR:-./extension}:/extension:ro
      - ${COLLECTION_DIR:-./testdata/baseline}:/collections:ro
      # The host CLI and container share the state directory and operation lock.
      - ${POSTPROCESSOR_STATE_DIR:-./work}:/workspace/work
    networks: [bloodhound]
networks:
  bloodhound:
    external: true
    name: ${BH_DOCKER_NETWORK:-esc1-poc_default}
