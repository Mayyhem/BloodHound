planResponses:
  '200': {description: Validated editor plan preview, content: {application/json: {schema: {type: object, properties: {data: {$ref: ./model.analysis-editor-plan.yaml}}, required: [data]}}}}
  '400': {description: Invalid editor file or declarations.}
  '403': {$ref: ../responses/forbidden.yaml}
  '409': {description: The displayed rules or schema revision changed.}
  '413': {description: Request exceeds the 4 MiB limit.}
  '502': {description: Current analysis inputs are unavailable.}
  '503': {description: Analysis editor is unavailable.}
testResponses:
  '200': {description: Discarded editor test result, content: {application/json: {schema: {type: object, properties: {data: {$ref: ./model.analysis-editor-result.yaml}}, required: [data]}}}}
  '400': {description: Invalid request, failed test, or unavailable required declarations.}
  '403': {$ref: ../responses/forbidden.yaml}
  '409': {description: 'The displayed rules, schema, or graph changed.'}
  '413': {description: Request exceeds the 4 MiB limit.}
  '408': {description: The test was canceled or its request timed out; no successful test was recorded.}
  '503': {description: Test discard or editor availability could not be confirmed.}
reviewResponses:
  '200': {description: Existing analysis change review, content: {application/json: {schema: {type: object, properties: {data: {$ref: ./model.analysis-preview.yaml}}, required: [data]}}}}
  '400': {description: Tested file cannot be activated with current declarations.}
  '403': {$ref: ../responses/forbidden.yaml}
  '409': {description: Successful test or review is stale.}
activateResponses:
  '200': {description: Activated revision, content: {application/json: {schema: {type: object, properties: {data: {type: object, additionalProperties: false, properties: {revision: {type: string}}, required: [revision]}}, required: [data]}}}}
  '403': {$ref: ../responses/forbidden.yaml}
  '409': {description: Successful test or review confirmation is stale.}
