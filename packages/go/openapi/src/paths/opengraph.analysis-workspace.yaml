get:
  summary: Inspect the current OpenGraph analysis plan and reports
  operationId: GetAnalysisWorkspace
  tags:
  - OpenGraph (Experimental)
  - Community
  description: Requires OpenGraph read permission and the extension-management feature
    flag. Returns a consistent copy of current activated files, complete execution
    dependencies, and received reports. Reads never calculate rules or write graph
    objects. The server keeps the rule-service token private and contacts only its
    configured destination. Outcomes belong on the current diagram only when BOTH
    rule and schema revisions match. Overall running status is not per-query live
    progress. Responses have a size and time limit and are not cached.
  responses:
    200:
      description: Current plan, including an explicit empty plan when no rules are
        active.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../schemas/model.analysis-workspace.yaml
            required:
            - data
    401:
      $ref: ../responses/unauthorized.yaml
    403:
      $ref: ../responses/forbidden.yaml
    404:
      $ref: ../responses/not-found.yaml
    502:
      description: The configured rule service or its schema read is unavailable,
        or its response is invalid or oversized.
    503:
      description: OpenGraph analysis is not configured.
