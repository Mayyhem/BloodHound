# Fresh Neo4j demonstration storage and ports. Combine with compose.yaml and
# compose.extensions.yaml using project name esc1-poc-persistent.
services:
  app-db:
    volumes:
      - ./work/persistent-neo/storage/postgres:/var/lib/postgresql
  graph-db:
    ports: !override
      - 127.0.0.1:37687:7687
      - 127.0.0.1:37474:7474
    volumes:
      - ./work/persistent-neo/storage/neo4j:/data
      - ./work/persistent-neo/storage/neo4j-logs:/logs
  bloodhound:
    environment:
      bhe_root_url: http://127.0.0.1:28080/
    ports: !override
      - 127.0.0.1:28080:8080
    volumes:
      - ./work/persistent-neo/storage/bloodhound:/opt/bloodhound/work
