type: object
properties:
  plan:
    $ref: ./model.analysis-workspace.yaml#/properties/plan
  dependencies:
    $ref: ./model.analysis-workspace.yaml#/properties/dependencies
  unused:
    type: array
    items: {type: string}
    description: Declarations in the edited file's depends-on lines that the file never uses, written as an author types them (for example node:Domain or query:PoC/users). Advice only; unused declarations are still accepted.
required: [plan, dependencies, unused]
