# Combine with the lab's existing compose.yaml. The databases remain unchanged.
services:
  bloodhound:
    image: ${EXTENSIONS_IMAGE:-esc1-poc-bloodhound-extensions:local}
    pull_policy: never
    environment:
      # Bootstrap creates this work directory before rule validation uses it.
      TMPDIR: /opt/bloodhound/work/tmp
      bhe_post_processing_url: http://rule-service:8081
      bhe_post_processing_token: ${POSTPROCESSOR_RULE_TOKEN:?Run scripts/build-extensions.sh to create private rules.env}
