plan:
  post:
    summary: Preview an analysis editor plan
    operationId: PreviewAnalysisEditorPlan
    tags: [OpenGraph (Experimental), Community]
    description: Requires OpenGraph read and write permission. Validates the proposed file and shows its complete selected prerequisite plan without calculating or writing graph data.
    requestBody: {required: true, content: {application/json: {schema: {$ref: ../schemas/model.analysis-editor-request.yaml}}}}
    responses: {$ref: ../schemas/model.analysis-editor-responses.yaml#/planResponses}
test:
  post:
    summary: Test an analysis editor file without publishing it
    operationId: TestAnalysisEditorFile
    tags: [OpenGraph (Experimental), Community]
    description: Requires OpenGraph read, write, and graph read permission, plus access to all environments. Every test recalculates the edited file and its complete needed prerequisite chain inside temporary graph changes that are discarded. Cancellation also discards the test. At most 500 rows and 1 MiB are displayed; total_rows remains the complete result count and truncated reports the limited display. A successful test is required only for this editor activation workflow; ordinary uploads are unchanged.
    requestBody: {required: true, content: {application/json: {schema: {$ref: ../schemas/model.analysis-editor-request.yaml}}}}
    responses: {$ref: ../schemas/model.analysis-editor-responses.yaml#/testResponses}
review:
  post:
    summary: Review a successfully tested analysis editor file
    operationId: ReviewAnalysisEditorFile
    tags: [OpenGraph (Experimental), Community]
    description: Requires OpenGraph read and write permission. Creates the existing analysis-change review for the exact successful editor test. A stale test or changed rule/schema revision returns conflict.
    requestBody: {required: true, content: {application/json: {schema: {$ref: ../schemas/model.analysis-editor-action.yaml}}}}
    responses: {$ref: ../schemas/model.analysis-editor-responses.yaml#/reviewResponses}
activate:
  put:
    summary: Activate a reviewed analysis editor file
    operationId: ActivateAnalysisEditorFile
    tags: [OpenGraph (Experimental), Community]
    description: Requires OpenGraph read and write permission. Activates only the tested editor file after the existing review confirmation. It requires a successful exact test and current revisions; stale confirmation returns conflict. A newly activated standalone intermediate file may return rows before a consumer is activated. The successful-test requirement applies only to editor activation; ordinary uploads are unchanged.
    requestBody: {required: true, content: {application/json: {schema: {$ref: ../schemas/model.analysis-editor-action.yaml}}}}
    responses: {$ref: ../schemas/model.analysis-editor-responses.yaml#/activateResponses}
