type: object
required:
- base_revision
- revision
- files
- ready
properties:
  base_revision:
    type: string
  revision:
    type: string
    description: Empty if no draft is saved.
  files:
    type: object
    maxProperties: 32
    additionalProperties:
      type: string
    description: Namespaced .cypher filenames mapped to original text. At most 1 MiB per file; the complete
      request is at most 4 MiB.
  overwrite:
    type: array
    maxItems: 32
    uniqueItems: true
    items:
      type: string
  ready:
    type: boolean
  validation_error:
    type: string
    description: Fixed guidance without parser excerpts or query literals. Invalid drafts remain downloadable
      and inactive.
