type: object
properties:
  installed_extensions:
    type: array
    description: Every currently installed extension, including extensions with no active analysis files. This list excludes retained associations for deleted schemas and is separate from plan.extensions, which describes only extensions represented in the active execution plan.
    items:
      type: object
      additionalProperties: false
      required:
      - namespace
      - name
      - display_name
      - version
      properties:
        namespace:
          type: string
        name:
          type: string
        display_name:
          type: string
        version:
          type: string
  plan:
    type: object
    properties:
      schema_revision:
        type: string
      revision:
        type: string
        description: Empty when no analyses are activated.
      name:
        type: string
      validation:
        type: object
        properties:
          files:
            type: string
          language:
            type: string
          database_execution:
            type: string
        required:
        - files
        - language
        - database_execution
      threads:
        type: array
        items:
          type: object
          properties: {}
        maxItems: 0
        description: Empty in the workspace; the legacy plan groups are not execution
          dependencies.
      queries:
        type: array
        items:
          $ref: ./model.analysis-query.yaml
        maxItems: 32
      extensions:
        type: array
        items:
          type: object
          properties:
            namespace:
              type: string
            name:
              type: string
            display_name:
              type: string
            environment_kind:
              type: string
              description: Optional icon source when the extension defines exactly one distinct environment kind.
          required:
          - namespace
          - name
          - display_name
    required:
    - revision
    - name
    - validation
    - threads
    - queries
    - extensions
  dependencies:
    type: array
    items:
      type: object
      properties:
        prerequisite:
          type: string
        consumer:
          type: string
        type:
          type: string
          enum:
          - query
          - node
          - relationship
        name:
          type: string
          description: The prerequisite query name or the graph kind that causes the
            wait.
        parameter:
          type: string
        conditions:
          type: string
      required:
      - prerequisite
      - consumer
      - type
      - name
    description: Complete runner-derived waits. Multiple reasons may connect the same
      queries. Shared outputs alone do not imply ordering.
  status:
    $ref: ./model.analysis-status.yaml
  observed_at:
    type: string
    format: date-time
required:
- installed_extensions
- plan
- dependencies
- status
- observed_at
