get:
  description: |
    **Experimental** - Reads the accepted definitions of installed, non-built-in extensions for analysis validation. Requires OpenGraph read permission and the extension-management feature flag. This does not activate analyses or install schemas.

    A null definition identifies an extension installed before definitions were preserved; upload its schema again through OpenGraph Management to associate analysis files. The declaration includes saved-query and privilege-zone components supplied with the upload. Their execution and availability still follow their existing feature controls.
  tags:
    - OpenGraph (Experimental)
    - Community
    - Enterprise
  operationId: ListExtensionDefinitions
  summary: Read installed OpenGraph definitions
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [definitions]
                properties:
                  definitions:
                    type: array
                    items:
                      type: object
                      required: [id, name, namespace, version, definition]
                      properties:
                        id:
                          type: integer
                          format: int32
                        name:
                          type: string
                        namespace:
                          type: string
                        version:
                          type: string
                        definition:
                          nullable: true
                          allOf:
                            - $ref: './../schemas/model.graph-extension.payload.yaml'
    401:
      $ref: './../responses/unauthorized.yaml'
    403:
      $ref: './../responses/forbidden.yaml'
    404:
      $ref: './../responses/not-found.yaml'
    500:
      $ref: './../responses/internal-server-error.yaml'
