# This stack is only for this experiment. Its data lives in ./work rather than
# Docker's shared data volumes. Docker itself still needs its normal image and
# container storage. Image downloads and stack startup are separate steps.
# PostgreSQL graph storage uses the application's selected database. This
# dedicated database preserves the Neo4j lab's original app-db and graph data.
name: esc1-poc
services:
  pg-db:
    image: docker.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    pull_policy: never
    environment:
      POSTGRES_USER: bloodhound
      POSTGRES_PASSWORD: experiment-only
      POSTGRES_DB: bloodhound
    ports:
      - 127.0.0.1:15432:5432
    volumes:
      - ${POC_PG_DATA_DIR:-./work/pg-reference-lab}/postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U bloodhound -d bloodhound"]
      interval: 2s
      timeout: 2s
      retries: 30
  bloodhound:
    # Separate API reference: unchanged native source, original DAWGS v0.9.1,
    # and its default development version. Build with scripts/build-reference.sh.
    image: esc1-poc-bloodhound-reference:2cb6dbd37738ffe31e34e1729b3638f3887a93e9
    pull_policy: never
    environment:
      bhe_database_connection: user=bloodhound password=experiment-only dbname=bloodhound host=pg-db port=5432
      bhe_graph_driver: pg
      bhe_default_admin_principal_name: admin
      bhe_default_admin_password: experiment-only
      bhe_default_admin_expire_now: "false"
      # A fixed test key keeps the local session valid across the application's
      # deliberate stop/start cycles. This key is only for this disposable lab.
      bhe_crypto_jwt_signing_key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      bhe_root_url: http://127.0.0.1:18080/
      bhe_enable_startup_wait_period: "false"
      bhe_datapipe_interval: "1"
    ports:
      - 127.0.0.1:18080:8080
    volumes:
      - ${POC_PG_DATA_DIR:-./work/pg-reference-lab}/bloodhound:/opt/bloodhound/work
    depends_on:
      pg-db:
        condition: service_healthy
  test-pg-graph:
    # A separate database and storage for destructive adapter tests.
    profiles: [tests]
    image: docker.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    pull_policy: never
    environment:
      POSTGRES_USER: bloodhound
      POSTGRES_PASSWORD: experiment-only
      POSTGRES_DB: esc1_poc_test
    ports:
      - 127.0.0.1:25432:5432
    volumes:
      - ./work/test-postgres:/var/lib/postgresql
