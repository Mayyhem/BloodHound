put:
  summary: Activate analysis change
  operationId: Activateanalysischange
  tags:
  - OpenGraph (Experimental)
  - Community
  description: Revalidate and activate exactly confirm_revision. Repeat the reviewed change with its base,
    schema, and optional draft revisions. Schema changes invalidate prior review. This does not start
    analysis or directly change graph results; relationship cleanup occurs after the next successful analysis.
    A saved draft is discarded separately. Requires the extension-management feature flag and OpenGraph
    read permission. Also requires OpenGraph write permission. Responses are not cached. The browser cannot
    supply a service destination or credentials.
  responses:
    200:
      description: Requested draft, review, or activated revision.
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                type: object
                required:
                - revision
                properties:
                  revision:
                    type: string
    401:
      $ref: ../responses/unauthorized.yaml
    403:
      $ref: ../responses/forbidden.yaml
    404:
      $ref: ../responses/not-found.yaml
    502:
      description: Service unavailable, invalid reply, or unconfirmed result. Refresh before another write.
    503:
      description: OpenGraph analysis is not configured.
    400:
      description: Invalid or ambiguous request; unknown fields and repeated JSON keys are rejected.
    409:
      description: Rule, schema, or draft revision changed, or overwrite confirmation is missing. Refresh
        and review again.
    413:
      description: Request exceeds 4 MiB.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/model.analysis-change.yaml
