# Fresh PostgreSQL demonstration storage and ports. Combine with compose.pg.yaml
# and compose.extensions.yaml. Run this OR the Neo4j persistent demonstration:
# both deliberately use application port 28080 and rule service port 18081.
services:
  pg-db:
    ports: !override
      - 127.0.0.1:35432:5432
    volumes:
      - ./work/persistent-pg/storage/postgres:/var/lib/postgresql
  bloodhound:
    environment:
      bhe_root_url: http://127.0.0.1:28080/
    ports: !override
      - 127.0.0.1:28080:8080
    volumes:
      - ./work/persistent-pg/storage/bloodhound:/opt/bloodhound/work
